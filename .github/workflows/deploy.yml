name: Deploy Website

on:
  push:
    branches:
      - main

jobs:
  web-deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest
    steps:
      - name: 🚚 Get latest code
        uses: actions/checkout@v3

      - name: 🔨 Install Dependencies & Build
        run: |
          npm install
          npm run build
          # Create the api folder inside the build output
          mkdir -p ./dist/api
          # Copy CONTENTS of your local php folder into dist/api
          # Using ./php/. ensures we don't get dist/api/php/ (double folder)
          cp -r ./php/. ./dist/api/

      - name: 📂 Sync Files to Hostinger
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./dist/
          # FIXED: Use ./ so it deploys to your current FTP login directory
          server-dir: ./ 
          protocol: ftp
          port: 21
          passive: true
          timeout: 120000
          dangerous-clean-slate: false